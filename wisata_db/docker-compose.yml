version: "3.8"

services:
  mariadb:
    image: mariadb:10.6
    container_name: wisata-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: wisata_db
      MYSQL_USER: wisata_user
      MYSQL_PASSWORD: wisata123
    ports:
      - "3306:3306"
    volumes:
      - ./db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
