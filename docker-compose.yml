services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=localhost
      - DB_USER=root
      - DB_PASS=root123
      - DB_NAME=wisata_db
      - DB_PORT=3306
      - SECRET_KEY=your-secret-key-here
    volumes:
      - .:/app

  db:
    image: mariadb:10.8
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=wisata_db
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: