<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Explore Batam</title>
  <link rel="stylesheet" href="/Web/static/css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- Login Container -->
  <div class="login-container">
    <div class="login-card">
      <h2>Login</h2>
      <p class="subtitle">Masuk untuk booking destinasi favoritmu</p>

      <form id="loginForm">
        <div class="input-group">
          <i class="fa fa-user"></i>
          <input type="text" id="username" placeholder="Username" required>
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="Password" required>
          <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
        </div>

        <button type="submit">Login</button>
        <p id="loginMessage"></p>
      </form>

      <p class="switch-page">Belum punya akun? <a href="register.html">Register</a></p>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
