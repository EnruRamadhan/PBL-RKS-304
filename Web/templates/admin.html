<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <style>
        body {
            background: #f3f4f6;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 500px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #333; }
        .btn {
            display: inline-block;
            padding: 12px 20px;
            background: #4CAF50;
            color: white;
            border-radius: 8px;
            margin-top: 20px;
            text-decoration: none;
        }
        .logout {
            background: #d9534f;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Welcome Admin, {{ username }} 👋</h1>
    <p>Anda berhasil masuk ke halaman admin.</p>

    <a href="/admin/index" class="btn">Masuk ke Dashboard Admin</a>
    <br><br>
    <a href="/logout" class="btn logout">Logout</a>
</div>

</body>
</html>
