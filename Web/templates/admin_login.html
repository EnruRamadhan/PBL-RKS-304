<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Explore Batam</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <h2>Login</h2>
      <p class="subtitle">Masuk untuk booking destinasi favoritmu</p>

      <!-- TAMPILKAN ERROR JIKA ADA -->
      {% if error %}
      <div class="error-message" style="background: #fee; color: #c00; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
        <i class="fas fa-exclamation-circle"></i>
        {{ error }}
      </div>
      {% endif %}

      <!-- FORM LOGIN DENGAN USERNAME -->
      <form method="POST" action="/login">
        <div class="input-group">
          <i class="fa fa-user"></i>
          <input type="text" name="username" placeholder="Username" required>  <!-- PAKAI USERNAME -->
        </div>

        <div class="input-group password-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" name="password" placeholder="Password" required>
          <i class="fa-solid fa-eye" id="togglePassword"></i>
        </div>

        <button type="submit">Login</button>
      </form>

      <p class="switch-page">
        Belum punya akun?
        <a href="{{ url_for('register') }}">Register</a>
      </p>
    </div>
  </div>

</body>
</html>
