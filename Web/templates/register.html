<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="register-container">
    <div class="register-card">
      <h2>Register</h2>
      <p class="subtitle">Buat akun baru untuk booking destinasi</p>
      
      <form id="registerForm" method="POST" action="/register">
        <div class="input-group">
          <i class="fa fa-user-tag"></i>
          <input type="text" id="regUsername" name="username" placeholder="Username" required>
        </div>

        <div class="input-group">
          <i class="fa fa-envelope"></i>
          <input type="email" id="regEmail" name="email" placeholder="Email" required>
        </div>
        <div class="input-group password-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="regPassword" name="password" placeholder="Password" required>
          <i class="fa-solid fa-eye toggle-icon" id="toggleRegPassword"></i>
        </div>

        <div class="input-group password-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="regConfirm" name="confirm_password" placeholder="Konfirmasi Password" required>
          <i class="fa-solid fa-eye toggle-icon" id="toggleRegConfirm"></i>
        </div>

        <button type="submit">Daftar</button>
        <p id="registerMessage"></p>
      </form>

      <p class="switch-page">Sudah punya akun? 
        <a href="{{ url_for('login') }}">Login</a>
      </p>
    </div>
  </div>
</body>
</html>
